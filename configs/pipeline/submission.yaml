# submission — the assignment-scale benchmark run, single-turn only.
#
# MANUALLY RUN, NEVER IN CI:
#
#     uv run python -m benchmark.pipeline run --config configs/pipeline/submission.yaml
#
# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------
# Same generation config as full.yaml (configs/generation/v0.yaml, `mixed`),
# but this run takes NONE of the multi-turn tail: `input_modes` admits only
# `single_turn`, and `max_inputs_per_mode` caps that at exactly 300 out of the
# 310 single-turn cells the grid produces (D x V_D + A_c x V_AC + A_F = 150 +
# 80 + 80 = 310) — a seeded sample of 10 dropped, deterministic across reruns
# via `slice_seed`. `multi_turn: 0` makes the exclusion explicit in the config
# itself rather than leaving it implied by an absent key.
#
#     300 traces, exactly the assignment's own >=300 deliverable.
#
# Why single-turn only, where full.yaml keeps a 30-conversation multi-turn
# tail: this config is the one meant to produce the assignment's actual
# deliverable file at exactly the requested scale, with nothing to explain
# about a sampled tail. full.yaml stays the config that puts multi-turn
# traces in the corpus at all — see Phase 8's use of it.
#
# ---------------------------------------------------------------------------
# What it costs (first run; a re-run is far cheaper, see below)
# ---------------------------------------------------------------------------
#   generation  ~1230 mid-tier LLM calls, ~30-40 min. NOTE: the whole grid is
#               expanded before the slice is applied — expansion belongs to
#               benchmark/generation/, slicing is a pipeline concern — so this
#               pays for the 920 multi-turn conversations it then drops, same
#               as full.yaml. Cached on disk and keyed by config hash, so only
#               the first run pays at all.
#   harness     300 single-turn runs at concurrency 8, plus LangSmith
#               span-ingestion polling: ~15-25 min (no multi-turn tail, so no
#               user-simulator calls and no multi-invocation conversations —
#               this is the part of full.yaml's harness estimate that scales
#               down the most).
#   ablation    Phase 5, single-turn-only corpus. Every trace here is the
#               `M = 1` degenerate case (docs/architecture/04-ablation-engine.md,
#               "Single-turn degenerate case"): Mode A reduces to a post-hoc
#               edit of the one response span, done directly by the ablation
#               engine WITHOUT calling `Harness.replay` — so this stage makes
#               no app calls at all. What is left is proposal/plan LLM calls
#               plus Mode-C fault re-runs through the app for the ablate
#               subset: single-digit minutes, well under full.yaml's
#               multi-turn-inclusive estimate.
#   engine      300 traces at analysis_concurrency 16 = 19 batches at ~49 s
#               per batch plus consolidation: ~21 min (apps/engine/README.md,
#               "Analysis concurrency" — this is the ruled 300-trace figure
#               the setting is chosen for).
#   scoring     seconds (TF-IDF, no judge).
#
#   Total: roughly 1.5-2 h of wall clock on the first run, most of it
#   generation and harness time. A re-run with a warm expansion cache and an
#   existing trace store is dominated by the Engine pass alone (~21 min).
run_id: submission
generation_config: configs/generation/v0.yaml
taxonomy: configs/taxonomy.yaml
target_app_config: configs/target_app.yaml
engine_app_config: configs/engine.yaml
seed_issueboard: null
artifacts_root: data/pipeline
# WARM THIS BEFORE THE TIMED RUN. Generation is the only stage whose cost is
# fully recoverable in advance: expansions are pure functions of (config hash,
# dim, variation, persona, seed), so pre-computing them moves ~300 OpenAI calls
# out of the measured window and makes the timed run's generation stage ~0s
# (measured: the mini smoke reports 0.0s against a warm cache).
#
# There is NO generation-only CLI subcommand, and the `--fake-*` flags are NOT
# a warming trick — `--fake-harness` substitutes the network-free FakeExpander,
# so nothing real is computed (and, since the cache key does not name the
# expander, that run is redirected to a per-run scratch cache precisely so it
# cannot poison this one). `scripts/generation_smoke.py` does not warm it
# either: it calls the expander directly, uncached, three times.
#
# Warm it with the generation stage on its own:
#
#   uv run python -c "
#   from benchmark.generation.config_loader import load_generation_config
#   from benchmark.generation.generators import generate_inputs
#   cfg = load_generation_config('configs/generation/v0.yaml')
#   d = generate_inputs(cfg, cache_dir='data/expansion_cache')
#   print(len(d.inputs), 'inputs cached')"
#
# It is idempotent and resumable — a second call is all cache hits, and an
# interrupted one keeps whatever it already wrote.
expansion_cache: data/expansion_cache

# Single-turn only: exactly 300 of the grid's 310 single-turn inputs, a seeded
# sample so a rerun picks the same 300. No multi-turn traces in this corpus.
input_modes: [single_turn]
max_inputs_per_mode:
  single_turn: 300
  multi_turn: 0
slice_seed: 20260824

harness:
  # The target app is a two-tool react agent on a small model; 8 concurrent
  # conversations keeps it busy without tripping provider rate limits.
  concurrency: 8

ablation:
  seed: 20260824
  control_fraction: 0.3
  min_eligible: 5
  n_per_category: 2

engine:
  # See configs/pipeline/mini.yaml: benchmark/models.py pins `gpt-5.1-mini`,
  # this account 404s on it, and both apps already default to `gpt-5-mini`.
  model: gpt-5-mini
  # RULED full-scale setting. A run costs ceil(n/N) batches, and a batch costs
  # its slowest trace: N=8 projects to ~35 min at 300 traces, N=16 to ~21 min
  # (apps/engine/README.md, "Analysis concurrency"). 16 is the clamp ceiling.
  analysis_concurrency: 16
  # MUST be passed explicitly: the server default of 25 caps a run at ~23
  # traces, and the failure mode is a recursion error mid-corpus.
  recursion_limit: 10000
  # `runs.wait` is ONE blocking request spanning the whole ~21 min pass; the
  # SDK's default read timeout is 300 s and would abort it five minutes in.
  # Generous margin over the projected time, same reasoning as full.yaml.
  timeout_s: 10800

scoring:
  severity_alpha: 0.5
  description_mode: similarity
  text_fallback_threshold: 0.5

deliverables:
  # The assignment's own number, met exactly rather than with full.yaml's
  # 40-trace margin: this config has no quarantine slack to spend, so a
  # quarantined trace here means a re-run (the harness skips inputs that
  # already have an ok trace, so a re-run is cheap).
  min_traces: 300

servers:
  target_app:
    script: apps/target_app/scripts/serve.sh
    label: "target app (:2024)"
  engine:
    script: apps/engine/scripts/serve.sh
    label: "engine (:2025)"
