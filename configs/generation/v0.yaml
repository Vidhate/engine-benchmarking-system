# v0 — product-support assistant generation config (Phase 3 checked-in config).
#
# Domain: a small support assistant with a RAG help-center doc store and one
# action tool (create_ticket). See docs/architecture/02-input-generation.md.
# single-turn N = (D x V_D) + (A_c x V_AC) + A_F = 150 + 80 + 80 = 310 (>= 300 required).
# fixed_adversarial: 10 hand-authored base attacks x 8 programmatic framing
# variants (see scripts used to build this file in the phase-3 report).
mode: mixed
max_turns: 6
seed: 20260823
app_context: 'A small product-support assistant for a fictional SaaS product. It answers user questions
  by retrieving from a RAG help-center document store covering billing, account, subscription, and integration
  topics, and it can take one action: create_ticket, which files a support ticket for a human agent when
  the assistant can''t resolve something itself. Users are the SaaS product''s own customers — end users,
  workspace admins, and billing contacts — reaching the assistant through an in-app chat widget.'
