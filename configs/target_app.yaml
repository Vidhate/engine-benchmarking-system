# The ONLY thing the benchmark knows about the target app.
# Matches benchmark.schemas.configs.TargetAppConfig.
base_url: "http://127.0.0.1:2024"
assistant_id: "target_app"
langsmith_project: "engine-bench-target"
# Declared Mode C shim surface. Values MUST be mappings, e.g.
#   configurable = {"fault_retriever": {"behavior": "stale"}}
# A bare string is refused by the app: langchain promotes str/int/float/bool
# `configurable` entries into inheritable tracing metadata, which would stamp
# the fault name onto every span of every ablated trace.
fault_configurable_keys:
  retriever: "fault_retriever"      #   irrelevant_docs | empty | stale
  tool: "fault_tool"                #   error | timeout | corrupted_result
  llm: "fault_llm"                  #   truncate_output
max_turns_supported: 8
