[project]
name = "target-app"
version = "0.1.0"
description = "Target AI app under benchmark: a product-support assistant (LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.2",
    "langchain-openai>=0.3",
    "langgraph>=0.6",
    "langsmith>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.2",
    "langgraph-sdk>=0.1",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["target_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
