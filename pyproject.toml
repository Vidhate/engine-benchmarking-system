[project]
name = "engine-benchmarking-system"
version = "0.1.0"
description = "Benchmark for Engine: trace generation, error ablation, and issueboard scoring"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Phase 4 harness: the ONLY LangGraph/LangSmith-aware component in benchmark/.
    # langgraph-sdk drives the target app; langsmith is the v0 trace-collection
    # backend (see docs/execution-plan.md, "Tracing backend").
    "langgraph-sdk>=0.4",
    "langsmith>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
