[project]
name = "engine-benchmarking-system"
version = "0.1.0"
description = "Benchmark for Engine: trace generation, error ablation, and issueboard scoring"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Phase 4 harness: the ONLY LangGraph/LangSmith-aware component in benchmark/.
    # langgraph-sdk drives the target app; langsmith is the v0 trace-collection
    # backend (see docs/execution-plan.md, "Tracing backend").
    "langgraph-sdk>=0.4",
    "langsmith>=0.11",
    # Benchmark-side LLM transport (the ablation agent and the prompt expander).
    # Not a tracing coupling: it buys bounded retries with 429 backoff and a real
    # per-request timeout, which hand-rolled urllib gave us neither of. Every
    # call site wraps its invocation in `langsmith.tracing_context(enabled=False)`
    # and passes empty callbacks, so these calls emit NO LangSmith runs — see
    # tests/test_tracing_boundary.py, which allowlists exactly the two files and
    # asserts the suppression is there.
    "langchain-openai>=0.3",
    # Phase 7 pipeline: the Engine invocation is one blocking request spanning
    # the whole pass, so it must pass its own httpx.Timeout (the SDK default
    # read timeout is 300s). Imported directly, so declared directly.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
